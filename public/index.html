<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/honeybee-favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070707" />
    <title>HONEY BEE Operation Center</title>
    <meta name="description" content="HONEY BEE 業務管理アプリ" />
    <meta property="og:title" content="HONEY BEE Operation Center" />
    <meta property="og:description" content="HONEY BEE 業務管理アプリ" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HONEY BEE Operation Center" />
    <meta name="twitter:description" content="HONEY BEE 業務管理アプリ" />
    <script>
      (function () {
        if (!/(?:^|[?&])reserve=1(?:&|$)/.test(location.search)) return;
        var title = "大船 HONEY BEE ご予約フォーム";
        var desc = "ライブ・イベントのご予約はこちらから";
        function setMeta(sel, value) {
          var el = document.querySelector(sel);
          if (el) el.setAttribute("content", value);
        }
        document.title = title;
        setMeta('meta[name="description"]', desc);
        setMeta('meta[property="og:title"]', title);
        setMeta('meta[property="og:description"]', desc);
        setMeta('meta[name="twitter:title"]', title);
        setMeta('meta[name="twitter:description"]', desc);
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/honeybee-icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
